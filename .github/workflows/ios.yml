name: iOS universal unsigned build
on:
  push:
    paths: ['ios/**', 'shared/**', 'scripts/build-catalog.mjs', 'package*.json', '.github/workflows/ios.yml', 'app/src/main/res/drawable-nodpi/**', 'app/src/main/assets/book-sources/**']
  workflow_dispatch:
    inputs:
      test_device:
        description: Simulator tests to run (device IPA is always built)
        type: choice
        default: all
        options: [all, iphone, ipad, none]
      test_filter:
        description: Optional comma-separated XCTest identifiers for focused regression
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SIMULATOR_TEST_FILTER: ${{ inputs.test_filter }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare shared music catalog and original artwork
        run: |
          mkdir -p .reference
          curl --fail --location --retry 3 https://codeload.github.com/XCQ0607/lxserver/zip/refs/tags/v2.2.0 -o .reference/lxserver.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('.reference/lxserver.zip') as archive:
              for name in archive.namelist():
                  if name.startswith(('lxserver-2.2.0/src/modules/utils/musicSdk/', 'lxserver-2.2.0/src/utils/lyricUtils/')) or name == 'lxserver-2.2.0/LICENSE':
                      archive.extract(name, '.reference')
          PY
          npm ci
          npm run catalog
          node ios/scripts/prepare-resources.mjs
          python3 ios/scripts/generate-project.py
      - name: Test audio DSP
        if: ${{ inputs.test_device != 'none' }}
        run: |
          cc -std=c11 -D_DARWIN_C_SOURCE ios/YinLang/Playback/AudioDSP.c ios/tests/audio-dsp-test.c -o /tmp/yinlang-dsp-test -lm
          /tmp/yinlang-dsp-test
      - name: Compile universal iPhone and iPad device archive
        id: archive
        run: |
          set -o pipefail
          xcodebuild -project ios/YinLang.xcodeproj -scheme YinLang -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/ios/build/YinLang.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | tee ios-device-build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p ios/build/package/Payload
          cp -R ios/build/YinLang.xcarchive/Products/Applications/YinLang.app ios/build/package/Payload/
          cd ios/build/package
          /usr/bin/zip -qry ../YinLang-0.8.8-unsigned.ipa Payload
          cd ..
          shasum -a 256 YinLang-0.8.8-unsigned.ipa > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          ipa = Path('YinLang-0.8.8-unsigned.ipa')
          info = plistlib.loads(Path('YinLang.xcarchive/Products/Applications/YinLang.app/Info.plist').read_bytes())
          # SideStore versions affected by non-ASCII appIdName must see an ASCII name.
          for key in ['CFBundleDisplayName', 'CFBundleName']:
              assert info[key].isascii() and info[key].strip(), f'{key} must be ASCII for SideStore'
          result = dict(commit=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'], version=info['CFBundleShortVersionString'], build=info['CFBundleVersion'], name=info['CFBundleDisplayName'], devices=info['UIDeviceFamily'], minimumOS=info['MinimumOSVersion'], unsigned=True, sha256=hashlib.sha256(ipa.read_bytes()).hexdigest(), bytes=ipa.stat().st_size)
          Path('build-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Upload installable package before simulator tests
        uses: actions/upload-artifact@v4
        with:
          name: YinLang-iOS-IPA
          retention-days: 30
          path: |
            ios/build/*.ipa
            ios/build/SHA256SUMS.txt
            ios/build/build-verification.json
      - name: Select available phone and tablet simulators
        if: ${{ inputs.test_device != 'none' }}
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          rows = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d.get('isAvailable')]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for kind, prefix in [('PHONE','iPhone'),('TABLET','iPad')]:
                  device = next(d for d in rows if d['name'].startswith(prefix))
                  f.write(f"{kind}_ID={device['udid']}\n")
                  print(kind, device['name'], device['udid'])
          PY
      - name: Test on iPhone
        if: ${{ inputs.test_device != 'ipad' && inputs.test_device != 'none' }}
        run: |
          set -o pipefail
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b
          selection=()
          if [ -n "$SIMULATOR_TEST_FILTER" ]; then
            IFS=',' read -ra filters <<< "$SIMULATOR_TEST_FILTER"
            for filter in "${filters[@]}"; do selection+=("-only-testing:$filter"); done
          fi
          xcodebuild -project ios/YinLang.xcodeproj -scheme YinLang -configuration Debug -destination "platform=iOS Simulator,id=$PHONE_ID" -parallel-testing-enabled NO -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/iPhone.xcresult "${selection[@]}" CODE_SIGNING_ALLOWED=NO test | tee ios-iphone-test.log
      - name: Upload iPhone test log
        if: ${{ !cancelled() && steps.archive.outcome == 'success' && inputs.test_device != 'ipad' && inputs.test_device != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: YinLang-iOS-iPhone-test-log
          retention-days: 30
          path: ios-iphone-test.log
      - name: Test on iPad
        if: ${{ !cancelled() && steps.archive.outcome == 'success' && inputs.test_device != 'iphone' && inputs.test_device != 'none' }}
        run: |
          set -o pipefail
          xcrun simctl shutdown "$PHONE_ID" || true
          xcrun simctl boot "$TABLET_ID" || true
          xcrun simctl bootstatus "$TABLET_ID" -b
          selection=(-only-testing:YinLangUITests -only-testing:YinLangTests/PlaybackTests)
          if [ -n "$SIMULATOR_TEST_FILTER" ]; then
            selection=()
            IFS=',' read -ra filters <<< "$SIMULATOR_TEST_FILTER"
            for filter in "${filters[@]}"; do selection+=("-only-testing:$filter"); done
          fi
          xcodebuild -project ios/YinLang.xcodeproj -scheme YinLang -configuration Debug -destination "platform=iOS Simulator,id=$TABLET_ID" -parallel-testing-enabled NO -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/iPad.xcresult "${selection[@]}" CODE_SIGNING_ALLOWED=NO test | tee ios-ipad-test.log
      - name: Upload iPad test log
        if: ${{ !cancelled() && steps.archive.outcome == 'success' && inputs.test_device != 'iphone' && inputs.test_device != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: YinLang-iOS-iPad-test-log
          retention-days: 30
          path: ios-ipad-test.log
      - name: Export layout screenshots
        if: always()
        run: |
          for device in iPhone iPad; do
            if [ -d "ios/build/$device.xcresult" ]; then
              xcrun xcresulttool export attachments --path "ios/build/$device.xcresult" --output-path "ios/build/screenshots/$device" || true
            fi
          done
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YinLang-iOS-layout-screenshots
          retention-days: 30
          path: ios/build/screenshots/
      - name: Upload unsigned IPA, archive and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YinLang-iOS-unsigned
          retention-days: 30
          path: |
            ios/build/*.ipa
            ios/build/SHA256SUMS.txt
            ios/build/build-verification.json
            ios/build/*.xcarchive
            ios/build/*.xcresult
            ios/build/screenshots/
            ios-*.log
