services:
  downloader:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DOWNLOAD_PORT:-8787}:8787"
    environment:
      DOWNLOAD_TOKEN: ${DOWNLOAD_TOKEN:?Set DOWNLOAD_TOKEN in .env}
      PRIVATE_MEDIA_HOSTS: ${PRIVATE_MEDIA_HOSTS:-}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-2147483648}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-2}
    volumes:
      - jobs:/state
      - type: bind
        source: ${MUSIC_DIR:-./downloads/music}
        target: /downloads/music
        bind:
          create_host_path: false
      - type: bind
        source: ${AUDIOBOOK_DIR:-./downloads/audiobooks}
        target: /downloads/audiobooks
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health', {headers: {Authorization: 'Bearer ' + process.env.DOWNLOAD_TOKEN}}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 5s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  jobs:
